[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swam"
version = "0.1.0"
description = "SWAM metagenomic AMR workflow: command-line tools and configuration UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ruamel.yaml>=0.18,<0.19",
  "textual>=6,<7",
]

[project.scripts]
swam = "swam.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swam" = ["tui.tcss"]
"swam.assets" = [
  "config/*.yaml",
  "config/**/*.yaml",
  "workflow/Snakefile",
  "workflow/envs/*.yaml",
  "workflow/rules/*.smk",
  "workflow/scripts/*.py",
  "workflow/scripts/*.R",
  "workflow/resources/*",
]
